# A simple cohort: diabetic patients on diazepam, minus those who have died.
# Root EXCEPT: Inclusion Criteria (INTERSECT of two sets) minus Exclusion Criteria (one set).
# Covers: the create line and its three containers, operation and name changes, sets with an identifier
# column, filters with and without parameters, a filter copied from a mandatory filter, child order.
cohort-script-format: "1"
exported-from:
  cohort-id: "101"
  cohort-name: "Diabetes on diazepam, alive"
  rdmp-version: "9.3.0"
  plugin-version: "1.0.0"
Commands:
  - "CreateNewCohortIdentificationConfiguration \"Diabetes on diazepam, alive\" => $cic101 $c201 $c202 $c203"
  - "Set CohortAggregateContainer:$c201 Operation EXCEPT"
  - "Set CohortAggregateContainer:$c201 Name \"Root Container\""
  - "Set CohortAggregateContainer:$c202 Operation INTERSECT"
  - "Set CohortAggregateContainer:$c202 Name \"Inclusion Criteria\""
  - "AddCatalogueToCohortSet CohortAggregateContainer:$c202 Catalogue:11 \"FT_Admissions\" chi false => $a301 $a301.chi"
  - "AddNewFilterContainer AggregateConfiguration:$a301 => $fc401"
  - "CreateNewFilter AggregateFilterContainer:$fc401 \"Diabetes since 2010\" \"main_condition LIKE @code AND admission_date >= '2010-01-01'\" => $f501"
  - "AddCohortParameter AggregateFilter:$f501 \"@code\" \"DECLARE @code AS varchar(10)\" \"'E1[0-4]%'\" null"
  - "SetFilterSource AggregateFilter:$f501 ExtractionFilter:61 \"Condition code\""
  - "AddCatalogueToCohortSet CohortAggregateContainer:$c202 Catalogue:12 \"FT_Prescribing\" chi false => $a302 $a302.chi"
  - "AddNewFilterContainer AggregateConfiguration:$a302 => $fc402"
  - "CreateNewFilter AggregateFilterContainer:$fc402 \"Diazepam\" \"drug_name = 'Diazepam'\" => $f502"
  - "Set CohortAggregateContainer:$c203 Operation UNION"
  - "Set CohortAggregateContainer:$c203 Name \"Exclusion Criteria\""
  - "AddCatalogueToCohortSet CohortAggregateContainer:$c203 Catalogue:13 \"FT_Demography\" chi false => $a303 $a303.chi"
  - "AddNewFilterContainer AggregateConfiguration:$a303 => $fc403"
  - "CreateNewFilter AggregateFilterContainer:$fc403 \"Valid identifier\" \"chi IS NOT NULL\" => $f503"
  - "SetFilterSource AggregateFilter:$f503 ExtractionFilter:63 \"Valid identifier\""   # copy of a mandatory filter
  - "CreateNewFilter AggregateFilterContainer:$fc403 \"Has died\" \"date_of_death IS NOT NULL\" => $f504"
  - "Set AggregateConfiguration:$a301 Order 0"
  - "Set AggregateConfiguration:$a302 Order 1"
  - "Set CohortAggregateContainer:$c202 Order 0"
  - "Set CohortAggregateContainer:$c203 Order 1"
